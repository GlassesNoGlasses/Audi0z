appId: com.duolume.mymusiclibrary
productName: my-music-library
directories:
  buildResources: build
  output: dist
# Only the build output and the manifest; electron-builder packs production node_modules on top.
files:
  - out/**
  - package.json
# ffmpeg-static ships a real executable; it cannot run from inside the asar archive.
asarUnpack:
  - '**/node_modules/ffmpeg-static/**'
mac:
  target:
    - dmg
  category: public.app-category.music
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc signed, not unsigned. v1 ships without a Developer ID, but `identity: null` skips
  # codesign altogether — and packaging rewrites Info.plist and renames the executable, which
  # breaks the seal Electron ships with. An arm64 bundle whose signature no longer matches is
  # refused outright by macOS ("the app is damaged"), so an ad-hoc signature is the minimum that
  # launches at all. It grants no Gatekeeper trust: the first launch still needs right-click Open.
  #
  # `hardenedRuntime: true` plus an ad-hoc identity means library validation would reject the
  # pre-signed Electron framework and the bundled yt-dlp/ffmpeg binaries, which carry a different
  # Team ID — `com.apple.security.cs.disable-library-validation` in build/entitlements.mac.plist
  # is what makes the combination work, and must stay.
  identity: '-'
  extraResources:
    - from: resources/bin/darwin/
      to: bin/
win:
  target:
    - nsis
  extraResources:
    - from: resources/bin/win32/
      to: bin/
linux:
  target:
    - AppImage
  category: AudioVideo
  extraResources:
    - from: resources/bin/linux/
      to: bin/
