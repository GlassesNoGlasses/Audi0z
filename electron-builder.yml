appId: com.gng.audi0z
productName: Audi0z
directories:
  buildResources: build
  output: dist
# Only the build output and the manifest; electron-builder packs production node_modules on top.
files:
  - out/**
  - package.json
# ffmpeg-static ships a real executable; it cannot run from inside the asar archive.
asarUnpack:
  - '**/node_modules/ffmpeg-static/**'
# Applies the macOS ad-hoc signature; a no-op on every other platform. See mac.identity below.
afterPack: build/adhocSign.js
# Copies the finished installer to ~/Desktop after every artifact build (post-checksum, so it
# cannot invalidate the ad-hoc signature).
afterAllArtifactBuild: build/copyArtifactsToDesktop.js
# No auto-updater, so no update metadata. Must be an EXPLICIT null: left unset, electron-builder
# resolves a github publish config, which crashes inside git worktrees ("Cannot detect repository")
# after the dmg is already written.
publish: null
mac:
  target:
    - dmg
  category: public.app-category.music
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc signed by build/adhocSign.js, NOT here: packaging breaks Electron's seal and an arm64
  # bundle with a broken signature refuses to launch, but `identity: '-'` gets hijacked by whatever
  # stray cert the keychain search matches first — so signing is off here and the hook runs
  # `codesign --sign -` on the packed .app. hardenedRuntime/entitlements above are kept for a
  # future Developer ID and do nothing while identity is null.
  identity: null
  extraResources:
    - from: resources/bin/darwin/
      to: bin/
win:
  target:
    - nsis
  extraResources:
    - from: resources/bin/win32/
      to: bin/
linux:
  target:
    - AppImage
  category: AudioVideo
  extraResources:
    - from: resources/bin/linux/
      to: bin/
