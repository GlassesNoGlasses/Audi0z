<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      `media-src 'self' media:` is load-bearing: audio is served over the custom media:// scheme
      and Chromium blocks it silently without an explicit allowance.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' media:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'"
    />
    <title>Audi0z</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
